<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Presentations by Jeremy Moseley</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: #0b0f16;
        color: #f7f4ed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 10% 10%, rgba(119, 212, 255, 0.12), transparent 28%),
          radial-gradient(circle at 85% 80%, rgba(232, 165, 255, 0.1), transparent 30%),
          #0b0f16;
      }

      main {
        width: min(100%, 64rem);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(3rem, 8vw, 6.5rem);
        letter-spacing: -0.04em;
        line-height: 1;
      }

      p {
        max-width: 40rem;
        margin: 0 0 2.5rem;
        color: #b9c0cc;
        font-size: clamp(1.15rem, 2.5vw, 1.6rem);
        line-height: 1.5;
      }

      a {
        display: block;
        padding: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 1rem;
        background: rgba(20, 27, 38, 0.82);
        color: inherit;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        border-color: #77d4ff;
        outline: none;
        box-shadow: 0 0 0 3px rgba(119, 212, 255, 0.12);
      }

      strong {
        display: block;
        margin-bottom: 0.5rem;
        color: #77d4ff;
        font-size: clamp(1.4rem, 3vw, 2rem);
      }

      span {
        color: #b9c0cc;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Presentations</h1>
      <p>Talks about building software, understanding users, and making better product decisions.</p>
      <a href="./product-focussed-engineer/">
        <strong>How to be a product focussed engineer</strong>
        <span>Open the presentation</span>
      </a>
    </main>
  </body>
</html>
